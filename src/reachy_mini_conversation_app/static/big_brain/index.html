<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160a33">
<title>Big Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Bungee&display=swap">
<style>
:root{
 --night:#160a33;--night2:#1f0e47;--plum:#2c1563;--plum2:#3b1d85;--violet:#6a3cff;--violet2:#4521c4;
 --gold:#ffcb3d;--gold2:#ffe48a;--goldd:#b77d00;--pink:#ff4fa3;--ink:#fff8ec;--dim:#cdbff5;--line:rgba(255,255,255,.14);
 --ok:#3ee08a;--okd:#139a52;--bad:#ff5a6a;--light:var(--pink);
 --disp:'Bungee','Arial Black','Impact',system-ui,sans-serif;
 --text:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 --ease:cubic-bezier(.2,.9,.3,1.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--night)}
body{color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.35;min-height:100vh;min-height:100dvh;overflow-x:hidden;
 background:transparent;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* Stage lighting: two spotlights from above and a glowing floor. Their colour follows the moment. */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background .6s;
 background:
  radial-gradient(60% 45% at 50% 108%,color-mix(in srgb,var(--light) 30%,transparent),transparent 70%),
  conic-gradient(from 160deg at 8% -6%,transparent 0deg,color-mix(in srgb,var(--light) 26%,transparent) 14deg,transparent 30deg),
  conic-gradient(from 170deg at 92% -6%,transparent 0deg,color-mix(in srgb,var(--violet) 34%,transparent) 16deg,transparent 32deg),
  radial-gradient(120% 70% at 50% -10%,#3a1a86 0,var(--night) 62%)}
body[data-mood=mine],body[data-mood=say]{--light:var(--tc)}
body[data-mood=final]{--light:var(--gold)}
body[data-mood=over]{--light:var(--gold)}
body[data-mood=paused]{--light:#7c6ca8}
input,.txt{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input{font:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}

/* ---------- marquee logo ---------- */
.marquee{position:relative;margin:18px auto 22px;width:max-content;max-width:100%;padding:13px;border-radius:22px;text-align:center;
 background:radial-gradient(circle,#fff3c4 0 2.6px,#ffcb3d 3.4px,rgba(255,203,61,.18) 5px,transparent 6.5px) 0 0/17px 17px,linear-gradient(#5a2a00,#2a1200);
 box-shadow:0 0 0 2px #7a4b00,0 0 34px rgba(255,203,61,.35),0 14px 30px rgba(0,0,0,.45)}
.marquee.chase{animation:chase 1.1s steps(4) infinite}
@keyframes chase{to{background-position:17px 0,0 0}}
.mq-in{background:radial-gradient(120% 120% at 50% 0,#3a1784,#1a0a3d);border-radius:12px;padding:14px 18px 12px;box-shadow:inset 0 0 0 2px rgba(255,203,61,.35),inset 0 -14px 30px rgba(0,0,0,.35)}
.mq-t{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(40px,13.5vw,64px);line-height:.92;letter-spacing:.01em;color:var(--gold);
 text-shadow:0 1px 0 #ffe9a3,0 3px 0 #d99a00,0 5px 0 #a86e00,0 7px 0 #6e4500,0 9px 14px rgba(0,0,0,.5),0 0 28px rgba(255,203,61,.45)}
.mq-ed{display:block;margin-top:8px;font-weight:800;font-size:16px;color:var(--gold2);font-stretch:85%}
.mq-tag{margin:-6px 0 6px;text-align:center;color:var(--dim);font-weight:600;font-size:16px}

/* ---------- header + scores ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px}
.brand{min-width:0;display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--gold);text-shadow:0 2px 0 #8a5a00,0 0 14px rgba(255,203,61,.35);white-space:nowrap}
.brand small{font-weight:700;font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-stretch:85%}
.me{display:flex;align-items:center;gap:8px;max-width:62%;padding:5px 12px 5px 6px;border-radius:999px;background:var(--tc);color:var(--tx);
 box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 18px color-mix(in srgb,var(--tc) 45%,transparent)}
.me .av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22);font-family:var(--disp);font-size:14px}
.me span:last-child{min-width:0;display:flex;flex-direction:column;line-height:1.05}
.me b{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{font-size:12px;font-weight:700;opacity:.85}
.scores{display:flex;gap:7px;margin-bottom:10px}
.sc{position:relative;flex:1 1 0;min-width:0;border-radius:14px;padding:7px 6px 6px;text-align:center;
 background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 30%,var(--plum)),var(--plum) 70%);
 border:2px solid color-mix(in srgb,var(--tc) 55%,transparent);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .3s var(--ease),box-shadow .3s}
.sc::before{content:'';position:absolute;left:10px;right:10px;top:-2px;height:5px;border-radius:0 0 6px 6px;background:var(--tc)}
.sc .sn{display:block;font-weight:800;font-size:12.5px;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .n{display:block;font-family:var(--disp);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.sc .you{position:absolute;right:-4px;top:-9px;background:var(--ink);color:var(--night);font-weight:800;font-size:10.5px;border-radius:999px;padding:1px 6px}
.sc.ctl{border-color:var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 2px var(--gold),0 0 22px rgba(255,203,61,.5);transform:translateY(-2px)}
.sc.ctl .sn{color:var(--gold2);opacity:1}
.sc .cue{display:inline-block;width:0;height:0;border-left:7px solid var(--gold);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:4px;vertical-align:1px}
.sc.bump{animation:bump .6s var(--ease)}
@keyframes bump{30%{transform:translateY(-6px) scale(1.1)}}

/* ---------- countdown ---------- */
#timer{display:none;align-items:center;gap:10px;margin:0 0 10px;position:sticky;top:calc(4px + env(safe-area-inset-top));z-index:5;
 padding:6px 6px 6px 12px;border-radius:999px;background:rgba(22,10,51,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--line)}
#timer.on{display:flex}
#timer .bar{flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 3px rgba(0,0,0,.5);overflow:hidden}
#timer .fill{height:100%;width:100%;border-radius:999px;transition:width .2s linear,background .3s;
 background:linear-gradient(90deg,#ffb020,var(--gold) 70%,#fff2b8);box-shadow:0 0 12px rgba(255,203,61,.8)}
#timer .secs{flex:none;min-width:48px;height:40px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#2a1600;
 font-family:var(--disp);font-size:19px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--goldd)}
#timer .secs::after{content:'s';font-family:var(--text);font-weight:800;font-size:14px;margin-left:1px}
#timer.low .fill{background:linear-gradient(90deg,#ff2e4d,var(--bad));box-shadow:0 0 14px rgba(255,90,106,.9)}
#timer.low .secs{background:var(--bad);color:#fff;box-shadow:0 3px 0 #a3192b,0 0 18px rgba(255,90,106,.7)}
#timer.low .secs.beat{animation:beat .5s ease-out}
@keyframes beat{0%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- host message (lower third) ---------- */
.msg{position:relative;margin:2px 4px 12px;padding:12px 16px;border-radius:16px;text-align:center;font-weight:800;font-size:21px;line-height:1.2;
 background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1600;box-shadow:0 5px 0 var(--goldd),0 10px 26px rgba(0,0,0,.35);rotate:-1deg}
.msg.good{background:linear-gradient(180deg,#8dfcc0,var(--ok));color:#03301a;box-shadow:0 5px 0 var(--okd),0 0 30px rgba(62,224,138,.5)}
.msg.bad{background:linear-gradient(180deg,#ff8f9b,var(--bad));color:#3a0009;box-shadow:0 5px 0 #a3192b,0 10px 26px rgba(0,0,0,.35);rotate:1deg}
.msg.pop{animation:pop .5s var(--ease)}
.msg.bad.pop{animation:pop .5s var(--ease),shake .4s .1s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes shake{25%{translate:-7px 0}50%{translate:6px 0}75%{translate:-3px 0}}

/* ---------- generic surfaces ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--plum2),var(--plum));border-radius:22px;padding:18px 16px;margin:0 0 12px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 0 rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.3)}
.card.fin{background:linear-gradient(180deg,#3d1f7a,var(--plum));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px rgba(255,203,61,.55),0 0 40px rgba(255,203,61,.18),0 6px 0 rgba(0,0,0,.3)}
.center{text-align:center}
.splash{min-height:72vh;min-height:72dvh;display:flex;flex-direction:column;justify-content:center}
h1,h2{margin:0;font-weight:800;line-height:1.1;font-stretch:88%}
h1{font-size:30px}h2{font-size:24px}
.sub{color:var(--dim);font-size:16.5px;font-weight:600;margin:6px 0 0}
label,.lbl{display:block;font-weight:800;font-size:16px;color:var(--dim);margin:14px 2px 8px}
.txt{width:100%;font-size:21px;font-weight:700;padding:14px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:#12072b;color:var(--ink);
 box-shadow:inset 0 3px 6px rgba(0,0,0,.45);outline:none;transition:border-color .15s,box-shadow .15s}
.txt::placeholder{color:#8b7cbc}
.txt:focus{border-color:var(--gold);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 0 0 4px rgba(255,203,61,.25)}
.primary{display:block;width:100%;margin-top:14px;padding:16px;min-height:60px;border:none;border-radius:18px;
 background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#f5b300);color:#2a1600;font-family:var(--disp);font-size:21px;letter-spacing:.02em;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--goldd),0 10px 22px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.primary:active:not(:disabled){transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--goldd)}
.primary:disabled{filter:saturate(.3) brightness(.7);cursor:default}
.start{font-size:28px;padding:20px;min-height:76px}
.spin{display:flex;justify-content:center;gap:8px;margin:16px auto 6px}
.spin i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:bulb 1.2s infinite}
.spin i:nth-child(2){animation-delay:.2s}.spin i:nth-child(3){animation-delay:.4s}
@keyframes bulb{0%,60%,100%{opacity:.25;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

/* ---------- join ---------- */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{position:relative;border:none;border-radius:18px;min-height:96px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
 background:radial-gradient(120% 90% at 20% 0,rgba(255,255,255,.35),transparent 55%),var(--tc);color:var(--tx);
 box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 color-mix(in srgb,var(--tc) 50%,#000),0 10px 20px rgba(0,0,0,.3);transition:transform .12s var(--ease),opacity .2s,filter .2s,box-shadow .12s}
.tbtn:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 2px 0 color-mix(in srgb,var(--tc) 50%,#000)}
.tbtn b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1}
.tbtn small{font-size:13.5px;font-weight:700;opacity:.9;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbtn .chk{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:#14062e;display:grid;place-items:center;transform:scale(0);transition:transform .25s var(--ease)}
.tbtn .chk svg{width:16px;height:16px}
.tbtn.sel{transform:scale(1.03);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--gold),0 0 30px color-mix(in srgb,var(--tc) 70%,transparent),0 6px 0 color-mix(in srgb,var(--tc) 50%,#000)}
.tbtn.sel .chk{transform:scale(1)}
.teams.picked .tbtn:not(.sel){opacity:.72;filter:saturate(.6) brightness(.85)}

/* ---------- lobby ---------- */
.inbadge{display:inline-flex;align-items:center;gap:10px;margin:14px auto 4px;padding:10px 18px 10px 10px;border-radius:999px;background:var(--tc);color:var(--tx);font-weight:800;font-size:19px;
 box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 30px color-mix(in srgb,var(--tc) 50%,transparent)}
.inbadge .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22);font-family:var(--disp);font-size:17px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;text-align:left}
.tl{border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--dim);background:rgba(0,0,0,.22);box-shadow:inset 4px 0 0 var(--tc)}
.tl b{display:block;font-size:16px;font-weight:800;color:var(--ink);margin-bottom:2px}
.tl b::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:6px;box-shadow:0 0 8px var(--tc)}
.kids{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 16px;min-height:60px;background:rgba(0,0,0,.25);border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;text-align:left}
.kids input{position:absolute;opacity:0;pointer-events:none}
.kids .sw{flex:none;width:62px;height:34px;border-radius:999px;background:#4b3a80;position:relative;transition:background .2s;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.kids .sw::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.4);transition:left .2s var(--ease)}
.kids input:checked+.sw{background:var(--ok)}
.kids input:checked+.sw::after{left:32px}
.kids input:focus-visible+.sw{outline:3px solid var(--gold2);outline-offset:3px}

/* ---------- board ---------- */
.turn{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px;margin:0 0 12px;text-align:center;line-height:1.15}
.turn b{display:block;font-size:26px;font-weight:800;font-stretch:88%}
.turn small{display:block;font-size:15.5px;font-weight:700;margin-top:4px;opacity:.9}
.turn.mine{background:var(--tc);color:var(--tx);box-shadow:0 0 0 3px var(--gold),0 6px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 40px var(--tc);animation:glow 1.4s ease-in-out infinite}
.turn.mine::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 2.4s .3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold),0 6px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 60px var(--tc)}}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.turn.theirs{background:rgba(0,0,0,.25);border:3px dashed var(--tc);color:var(--ink)}
.turn.theirs b{font-size:21px}
.turn.theirs b::before{content:'';display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--tc);margin-right:8px;vertical-align:1px;box-shadow:0 0 12px var(--tc)}
.hint{text-align:center;font-weight:800;font-size:20px;margin:4px 0 12px;color:var(--dim)}
.boardwrap{border-radius:20px;padding:8px;background:linear-gradient(180deg,#2a1200,#170900);
 box-shadow:0 0 0 2px #7a4b00,inset 0 0 0 1px rgba(255,203,61,.4),0 0 40px rgba(106,60,255,.35),0 14px 30px rgba(0,0,0,.45)}
.board{display:grid;gap:5px}
.ct{display:flex;align-items:center;justify-content:center;min-height:46px;padding:4px 2px;border-radius:9px;background:linear-gradient(180deg,#21104e,#170a39);
 font-size:11.5px;font-weight:800;line-height:1.1;text-align:center;color:var(--ink);font-stretch:80%;word-break:break-word;hyphens:auto;overflow:hidden}
.cell{min-height:clamp(58px,8vh,80px);border-radius:9px;display:flex;align-items:center;justify-content:center;border:none;padding:0;
 background:radial-gradient(90% 70% at 50% 15%,#8b66ff,var(--violet) 45%,var(--violet2));
 color:var(--gold);font-family:var(--disp);font-size:clamp(15px,4.6vw,22px);text-shadow:0 2px 0 #8a5a00,0 0 12px rgba(255,203,61,.55);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.3)}
.cell.used{background:#120729;box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.board.off .cell:not(.used){filter:saturate(.55) brightness(.75)}
button.cell{transition:transform .1s var(--ease)}
.board.on button.cell{animation:cellpulse 1.6s ease-in-out infinite;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes cellpulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.3),0 0 0 2px var(--gold),0 0 14px rgba(255,203,61,.6)}}
button.cell:active,button.cell.chosen{transform:scale(.92);background:var(--gold);color:#2a1600;text-shadow:none}
.board button.cell.chosen{animation:chosen .5s var(--ease) both}
@keyframes chosen{0%{transform:scale(.9)}50%{transform:scale(1.18);box-shadow:0 0 0 4px #fff,0 0 30px var(--gold)}100%{transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 24px var(--gold)}}

/* ---------- the clue screen ---------- */
.screen{position:relative;border-radius:22px;padding:16px 16px 18px;margin:0 0 12px;overflow:hidden;
 background:radial-gradient(120% 80% at 50% 0,#5a35e8,#3417a8 50%,#220d73);
 box-shadow:0 0 0 2px rgba(255,203,61,.55),inset 0 0 0 1px rgba(255,255,255,.15),0 0 36px rgba(106,60,255,.45),0 12px 30px rgba(0,0,0,.4)}
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),linear-gradient(160deg,rgba(255,255,255,.14),transparent 40%)}
.cluehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.cat{font-weight:800;font-size:17px;color:var(--gold2);font-stretch:85%;line-height:1.15}
.pts{flex:none;font-family:var(--disp);font-size:26px;color:var(--gold);text-shadow:0 2px 0 #8a5a00,0 0 16px rgba(255,203,61,.6)}
.cluehead.huge{flex-direction:column;justify-content:center;text-align:center;min-height:170px;margin:0;gap:4px}
.cluehead.huge .cat{font-size:26px;color:var(--ink)}
.cluehead.huge .pts{font-size:68px;line-height:1.05;text-shadow:0 2px 0 #ffe9a3,0 4px 0 #d99a00,0 7px 0 #8a5a00,0 0 30px rgba(255,203,61,.6)}
.clue{margin:0;font-size:22px;font-weight:700;line-height:1.32;text-wrap:pretty;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.twist{text-align:center;margin:0 0 10px}
.twist .tag{display:inline-block;font-family:var(--disp);font-size:20px;padding:6px 16px;border-radius:12px;transform:rotate(-2deg);
 background:var(--pink);color:#fff;box-shadow:0 4px 0 #a3125c,0 0 26px rgba(255,79,163,.6)}
.twist.double .tag{background:var(--gold);color:#2a1600;box-shadow:0 4px 0 var(--goldd),0 0 26px rgba(255,203,61,.6)}
.twist.everyone .tag{background:var(--ok);color:#03301a;box-shadow:0 4px 0 var(--okd),0 0 26px rgba(62,224,138,.55)}
.twist p{margin:10px 4px 0;font-weight:700;font-size:15.5px;color:var(--ink)}

  h += '<button type="button" class="tbtn' + (draft.team === k ? ' sel' : '') + '" aria-pressed="' + (draft.team === k) + '" data-act="team" data-v="' + k + '" ' + ts(k) + '><span class="chk" aria-hidden="true">' + ICON.check + '</span><b>' + esc(tname(k)) + '</b><small>' + esc(playersOf(k)) + '</small></button>';
 });
 return h + '</div><button class="primary" type="submit">' + esc(L.join) + '</button></form>';
}
function boardHtml() {
 var L = t(), b = S.board; if (!b || !b.columns) return '<div class="card center"><p class="sub">' + esc(L.next) + '</p></div>';
 var pick = can('pick') && !pickLock, cols = b.columns, rows = 0;
 cols.forEach(function (c) { rows = Math.max(rows, (c.cells || []).length); });
 var hint = pick ? '<div class="turn mine" ' + ts(S.you.team) + '><b>' + esc(L.myTurn) + '</b><small>' + esc(L.myTurnSub) + '</small></div>'
  : S.control ? '<div class="turn theirs" ' + ts(S.control) + '><b>' + esc(L.notMyTurn(tname(S.control))) + '</b><small>' + esc(L.notMyTurnSub) + '</small></div>'
  : '<div class="hint">' + esc(L.waitPickAny) + '</div>';
 var h = hint + '<div class="boardwrap"><div class="board ' + (pick ? 'on' : 'off') + '" style="grid-template-columns:repeat(' + cols.length + ',minmax(0,1fr))">';
 cols.forEach(function (c) { h += '<div class="ct">' + esc(c.title) + '</div>'; });
 for (var r = 0; r < rows; r++) for (var ci = 0; ci < cols.length; ci++) {
  var cell = (cols[ci].cells || [])[r], i = ' style="--i:' + (r + ci) + '"';
  if (!cell || cell.used) h += '<div class="cell used"' + i + '></div>';
  else if (pick) h += '<button type="button" class="cell" data-act="pick" data-c="' + ci + '" data-r="' + r + '"' + i + ' aria-label="' + esc(cols[ci].title + ', ' + cell.points) + '">' + esc(cell.points) + '</button>';
  else h += '<div class="cell"' + i + '>' + esc(cell.points) + '</div>';
 }
 return h + '</div></div>';
}
function sentBox(text, more) {
 return '<div class="sent' + (fresh('s:' + S.phase + text) ? ' new' : '') + '" role="status"><span class="ok" aria-hidden="true">' + ICON.check + '</span><span>' + text + (more ? '<small>' + more + '</small>' : '') + '</span></div>';
}
function answerForm() {
 var L = t(), h = '';
 if (can('answer')) h += '<form id="fAns" class="ansform" autocomplete="off"><input id="iAns" class="txt" maxlength="100" autocomplete="off" enterkeyhint="send" aria-label="' + esc(L.yourAnswer) + '" placeholder="' +
  esc(L.yourAnswer) + '" value="' + esc(draft.answer) + '"><button class="primary" type="submit">' + esc(L.send) + '</button></form>';
 if (sent.answer != null) h += sentBox(esc(L.sent) + ': “' + esc(sent.answer) + '”', can('answer') ? esc(L.canResend) : '');
 else if (!can('answer')) h += '<p class="watch">' + esc(L.watch) + '</p>';
 return h;
}
function finalHead() {
 var cat = (S.final && S.final.category) || (S.clue && S.clue.column) || '';
 return '<div class="finale"><span class="tag">' + esc(t().finalTitle) + '</span><span class="fcat">' + esc(cat) + '</span></div>';
}
function betForm() {
 var L = t(), max = Math.max(0, S.max_bet || 0), h = '';
 if (can('bet')) {
  h += '<form id="fBet" autocomplete="off"><label for="iBet">' + esc(L.bet) + ' · ' + esc(L.maxBet(max)) + '</label>' +
   '<input id="iBet" class="txt betnum" type="number" inputmode="numeric" min="0" max="' + max + '" step="100" enterkeyhint="send" placeholder="0" value="' + esc(draft.bet) + '">' +
   '<div class="quick"><button type="button" data-act="q" data-v="0">' + esc(L.zero) + '</button><button type="button" data-act="q" data-v="' + Math.floor(max / 2) + '">' +
   esc(L.half) + '<small>' + Math.floor(max / 2) + '</small></button><button type="button" data-act="q" data-v="' + max + '">' + esc(L.max) + '<small>' + max + '</small></button></div>' +
   '<button class="primary" type="submit">' + esc(L.send) + '</button></form>';
 }
 if (sent.bet != null) h += sentBox(esc(L.betSent(sent.bet)), '');
 else if (!can('bet')) h += '<p class="watch">' + esc(L.watch) + '</p>';
 return h;
}
function revealHtml() {
 var L = t(), f = S.final || {}, h = '<div class="card fin"><div class="finale" style="padding-top:4px"><span class="tag">' + esc(L.reveal) + '</span>' + (f.category ? '<span class="fcat">' + esc(f.category) + '</span>' : '') + '</div><ul class="rv">';
 (f.answers || []).forEach(function (a) {
  var nw = a.right != null && fresh('m:' + a.team + a.right) ? ' new' : '';
  var mk = a.right === true ? '<span class="mark y' + nw + '" role="img" aria-label="✓">' + ICON.check + '</span>' : a.right === false ? '<span class="mark n' + nw + '" role="img" aria-label="✗">' + ICON.cross + '</span>' : '<span class="mark"></span>';
  h += '<li ' + ts(a.team) + '><div class="t"><b>' + esc(tname(a.team)) + '</b><span>' + esc(a.text ? a.text : L.noAnswer) + '</span></div>' +
   (a.bet != null ? '<span class="bet">' + esc(a.bet) + '</span>' : '') + mk + '</li>';
 });
 if (f.answer) h += '</ul>' + answerBox(L.answerIs, f.answer) + '<ul class="rv">';
 return h + '</ul></div>';
}
function overHtml() {
 var L = t(), ts_ = (S.teams || []).slice().sort(function (a, b) { return b.score - a.score; }), h = '';
 if (ts_.length) {
  var top = ts_[0].score, win = ts_.filter(function (x) { return x.score === top; });
  h += '<div class="win" ' + ts(win[0].key) + '>' + ICON.trophy + '<div class="w1">' + esc(win.length > 1 ? L.winners : L.winner) + '</div><div class="w2">' +
   win.map(function (x) { return esc(x.name); }).join(' · ') + '</div><div class="w1">' + esc(top) + ' ' + esc(L.pts) + '</div></div>';
  h += '<ol class="final">';
  ts_.forEach(function (x, i) { h += '<li ' + ts(x.key) + '><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(x.name) + '</span><span class="sv">' + esc(x.score) + '</span></li>'; });
  h += '</ol>';
 }
 if (S.final && S.final.answer) h += '<div>' + answerBox(L.finalAnswer, S.final.answer) + '</div>';
 return h + '<div class="card center" style="margin-top:12px"><h1>' + esc(L.thanks) + '</h1></div>';
}

// ---------- countdown ----------
function tick() {
 var el = $('timer');
 if (!S || !S.deadline) { el.classList.remove('on'); lastSecs = null; return; }
 var rem = S.deadline - Date.now();
 if (dl.key !== S.deadline) { dl.key = S.deadline; dl.total = Math.max(1000, rem); }
 rem = Math.max(0, rem);
 var secs = Math.ceil(rem / 1000), low = rem < 5000, box = el.querySelector('.secs');
 el.classList.add('on'); el.classList.toggle('low', low);
 el.querySelector('.fill').style.width = Math.min(100, rem / dl.total * 100) + '%';
 box.textContent = secs;
 if (secs !== lastSecs) {
  if (low && secs > 0) {
   box.classList.remove('beat'); void box.offsetWidth; box.classList.add('beat');
   if (secs <= 3 && (can('buzz') || can('answer') || can('bet') || can('pick'))) buzzv(15);
  }
  lastSecs = secs;
 }
}
setInterval(tick, 200);

// ---------- input ----------
function onBuzz(e) {
 var b = e.target && e.target.closest ? e.target.closest('#buzzer') : null;
 if (!b) return;
 e.preventDefault();
 if (b.disabled || buzzLock || !can('buzz')) return;
 if (!send({type: 'buzz'})) return;
 buzzLock = true; cache.stage = null;
 buzzv([40, 30, 90]);
 b.disabled = true; b.classList.add('pressed');
 var w = b.closest('.buzzwrap'); if (w) { w.classList.remove('live'); w.classList.add('hit', 'sent'); }
}
var stage = $('stage');
if (window.PointerEvent) stage.addEventListener('pointerdown', onBuzz);
else { stage.addEventListener('touchstart', onBuzz, {passive: false}); stage.addEventListener('mousedown', onBuzz); }
stage.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('#buzzer')) e.preventDefault(); });

document.addEventListener('input', function (e) {
 var id = e.target.id;
 if (id === 'iName') draft.name = e.target.value;
 else if (id === 'iAns') draft.answer = e.target.value;
 else if (id === 'iBet') draft.bet = e.target.value;
});
document.addEventListener('click', function (e) {
 var el = e.target.closest ? e.target.closest('[data-act]') : null;
 if (!el || el.disabled) return;
 var a = el.getAttribute('data-act');
 if (a === 'team') { draft.team = el.getAttribute('data-v'); buzzv(20); render(); }
 else if (a === 'pick') {
  if (pickLock || !can('pick')) return;
  if (send({type: 'pick', column: +el.getAttribute('data-c'), row: +el.getAttribute('data-r')})) {
   pickLock = true; el.classList.add('chosen'); buzzv(50); cache.stage = null;
  }
 } else if (a === 'q') { draft.bet = el.getAttribute('data-v'); render(); }
 else if (a === 'start') {
  if (!startLock && can('start') && send({type: 'start'})) { startLock = true; el.disabled = true; cache.stage = null; }
 } else if (a === 'resume') {
  if (can('resume') && send({type: 'resume'})) { el.disabled = true; }
 } else if (a === 'vote') {
  if (send({type: 'vote'})) { voteLock = true; el.disabled = true; cache.extra = null; buzzv(40); }
 }
});
document.addEventListener('submit', function (e) {
 e.preventDefault();
 var id = e.target.id, L = t();
 if (id === 'fJoin') {
  var name = draft.name.trim().slice(0, 16);
  if (!name) { toast(L.needName); return; }
  if (!draft.team) { toast(L.needTeam); return; }
  send({type: 'join', name: name, team: draft.team, player: load() || null});
 } else if (id === 'fAns') {
  var txt = draft.answer.trim();
  if (!txt) return;
  if (send({type: 'answer', text: txt})) { sent.answer = txt; draft.answer = ''; blur(); buzzv(30); cache.stage = null; render(); }
 } else if (id === 'fBet') {
  var max = Math.max(0, (S && S.max_bet) || 0), v = parseInt(draft.bet, 10);
  if (isNaN(v)) v = 0;
  v = Math.max(0, Math.min(max, v));
  if (send({type: 'bet', points: v})) { sent.bet = v; draft.bet = String(v); blur(); buzzv(30); cache.stage = null; render(); }
 }
});
document.addEventListener('change', function (e) {
 if (e.target.id !== 'iKids') return;
 cache.stage = null;
 if (!can('settings') || !send({type: 'kids', on: !!e.target.checked})) e.target.checked = !!(S && S.kids);
});
function blur() { var a = document.activeElement; if (a && a.blur) a.blur(); }

render();
connect();
})();
</script>
</body>
</html>
