<meta charset="utf-8">

<meta name="theme-color" content="#0d3b2a">
<title>Ballpark</title>

<style>
:root{
 --field:#0f4a33;--field2:#0b3626;--deep:#072519;--tile:#13563c;--tile2:#1a6a4a;
 --chalk:#fbfaf3;--chalk2:#e6f4ea;--ink:#0b2618;--dim:#b8dcc6;
 --gold:#ffc83d;--goldd:#b98600;--coral:#ff5a5f;--mint:#54e3a0;
 --fd:"Bowlby One","Arial Black",Impact,system-ui,sans-serif;
 --fb:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --gut:max(14px,env(safe-area-inset-left));--gutr:max(14px,env(safe-area-inset-right));
 --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--field2) repeating-linear-gradient(90deg,#114f37 0 44px,#0e4630 44px 88px) fixed}
body{min-height:100vh;min-height:100dvh;color:var(--chalk);font-family:var(--fb);font-weight:500;overflow-x:hidden;background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.12),transparent 60%);
 -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
input,.txt{user-select:text;-webkit-user-select:text}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) var(--gutr) calc(36px + env(safe-area-inset-bottom)) var(--gut)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:20px;letter-spacing:.02em;text-shadow:0 3px 0 var(--deep)}
.mark svg,.word svg{display:block}
.me{display:flex;align-items:center;gap:6px;background:var(--tc);color:var(--tx);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;max-width:60%;box-shadow:0 3px 0 var(--td)}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scores{display:flex;gap:6px;margin:0 0 10px}
.sc{position:relative;flex:1 1 0;min-width:0;background:var(--deep);border-radius:12px;padding:6px 6px 5px;text-align:center;border-bottom:5px solid var(--tc)}
.sc b{display:block;font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc span{display:block;font-family:var(--fd);font-size:22px;line-height:1.15;color:var(--gold);font-variant-numeric:tabular-nums}
.sc i{position:absolute;right:5px;top:4px;font-style:normal;font-size:12px;font-weight:900;color:var(--mint)}
.sc .plus{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-family:var(--fd);font-size:17px;color:var(--gold);text-shadow:0 2px 0 var(--deep);animation:plus 1.8s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.goal{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--dim);margin:-4px 0 10px}
.goal .tr{flex:1;height:8px;border-radius:9px;background:var(--deep);position:relative;overflow:hidden}
.goal .tr b{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--gold)}
#timer{display:none;align-items:center;gap:10px;margin:0 0 10px}
#timer.on{display:flex}
#timer .bar{flex:1;height:14px;background:var(--deep);border-radius:99px;overflow:hidden}
#timer .fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#fff1a8);transition:width .2s linear}
#timer .secs{font-family:var(--fd);font-size:22px;min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
#timer.low .fill{background:var(--coral)}
#timer.low .secs{color:var(--coral);animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.14)}}
.ribbon{background:var(--gold);color:var(--ink);font-weight:900;font-size:18px;text-align:center;border-radius:16px;padding:10px 14px;margin:0 0 12px;box-shadow:0 5px 0 var(--goldd);animation:drop .45s var(--pop) both}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.92)}}
.card{background:var(--chalk);color:var(--ink);border-radius:24px;padding:18px 16px;margin:0 0 12px;box-shadow:0 6px 0 var(--deep)}
.center{text-align:center}
h1,h2{font-family:var(--fd);font-weight:400;margin:0;line-height:1.05}
h1{font-size:30px}h2{font-size:22px}
.sub{color:#3f6b55;font-size:16px;line-height:1.35;margin:6px 0 0}
.primary{display:block;width:100%;min-height:58px;margin-top:14px;padding:14px;border:0;border-radius:18px;background:var(--gold);color:var(--ink);font-family:var(--fd);font-size:22px;box-shadow:0 6px 0 var(--goldd);transition:transform .08s,box-shadow .08s}
.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--goldd)}
.primary:disabled{opacity:.5}
label,.lbl{display:block;font-weight:800;font-size:15px;color:#3f6b55;margin:14px 0 8px}
.txt{width:100%;min-height:56px;font-size:22px;font-weight:800;padding:12px 14px;border-radius:16px;border:3px solid #cfe5d7;background:#fff;color:var(--ink)}
.txt:focus{border-color:var(--field);box-shadow:0 0 0 4px rgba(255,200,61,.6)}
.txt::placeholder{color:#93b3a1;font-weight:600}
.hero{text-align:center;padding:16px 0 6px}
.word{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-size:54px;line-height:1;text-shadow:0 5px 0 var(--deep);margin:0}
.tag{font-weight:800;font-size:17px;color:var(--gold);margin:8px 0 0}
.dots{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--chalk);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px);opacity:.5}}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{position:relative;background:var(--tc);color:var(--tx);border:0;border-radius:18px;min-height:92px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:0 5px 0 var(--td);transition:transform .2s var(--pop),opacity .2s}
.tbtn b{font-family:var(--fd);font-weight:400;font-size:21px;line-height:1}
.tbtn small{font-size:13px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn .ck{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--chalk);color:var(--ink);display:grid;place-items:center;font-weight:900;transform:scale(0);transition:transform .25s var(--pop)}
.tbtn.sel{box-shadow:0 5px 0 var(--td),0 0 0 4px var(--ink),0 0 0 7px var(--gold)}
.tbtn.sel .ck{transform:scale(1)}
.teams.picked .tbtn:not(.sel){opacity:.55}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;text-align:left}
.tl{background:#eaf5ee;border-radius:14px;padding:9px 10px;border-top:6px solid var(--tc);min-width:0}
.tl b{display:block;font-family:var(--fd);font-weight:400;font-size:16px;margin-bottom:6px}
.tl .p{display:inline-block;background:var(--tc);color:var(--tx);border-radius:99px;padding:3px 9px;margin:0 4px 4px 0;font-size:14px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .none{font-size:14px;color:#6f8f7d}
.qcard{background:var(--chalk);color:var(--ink);border-radius:24px;padding:16px;margin:0 0 12px;box-shadow:0 6px 0 var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border-radius:99px;padding:5px 11px;font-weight:800;font-size:14px;background:#dcefe3;color:var(--field)}
.chip.sp{background:var(--gold);color:var(--ink);animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.05)}}
.q{font-weight:900;font-size:24px;line-height:1.22;word-break:break-word}
.unit{display:inline-block;margin-top:10px;font-weight:800;font-size:15px;color:#3f6b55;background:#eaf5ee;border-radius:99px;padding:5px 12px}
.range{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:14px}
.range .dash{font-family:var(--fd);font-size:26px;padding-bottom:12px;color:#3f6b55}
.range label{margin:0 0 6px}
.range .txt{text-align:center;font-variant-numeric:tabular-nums}
.big{display:block;text-align:center;font-size:13px;font-weight:700;color:#3f6b55;min-height:18px;margin-top:4px}
.copying{margin-top:14px;padding:14px;border-radius:16px;background:var(--tc);color:var(--tx);font-weight:900;font-size:18px;text-align:center}
.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pw{position:relative;min-height:64px;border:3px solid #cfe5d7;border-radius:16px;background:#fff;color:var(--ink);font-weight:900;font-size:15px;line-height:1.1;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pw .ic{font-family:var(--fd);font-size:20px}
.pw small{font-size:11px;font-weight:700;color:#5e7f6c}
.pw.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.pw.on small{color:var(--dim)}
.pw:disabled{opacity:.35;text-decoration:line-through}
.pick{margin-top:10px;padding:12px;border-radius:16px;background:#eaf5ee}
.pick p{margin:0 0 8px;font-weight:800;font-size:15px}
.pick .row{display:flex;flex-wrap:wrap;gap:8px}
.pick button{flex:1 1 40%;min-height:48px;border:0;border-radius:14px;background:var(--tc);color:var(--tx);font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--td)}
.pick button.sel{box-shadow:0 4px 0 var(--td),0 0 0 3px var(--ink),0 0 0 6px var(--gold)}
.sent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:16px;background:#d6f6e4;color:#0d5536;animation:drop .35s var(--pop) both}
.sent .ok{flex:none;width:30px;height:30px;border-radius:50%;background:#21a56b;color:#fff;display:grid;place-items:center;font-weight:900}
.sent b{display:block;font-weight:900;font-size:17px;word-break:break-word}
.sent small{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:2px}
.wait{display:flex;align-items:center;gap:12px;border-radius:20px;padding:14px 16px;margin:0 0 12px;background:var(--deep);border:3px solid var(--tile2)}
.wait b{display:block;font-family:var(--fd);font-weight:400;font-size:20px}
.wait small{display:block;font-size:15px;color:var(--dim);font-weight:700;margin-top:3px}
.answer{background:var(--ink);color:var(--chalk);border-radius:24px;padding:16px;margin:0 0 12px;text-align:center;box-shadow:0 6px 0 #000;animation:drop .5s var(--pop) both;border:4px solid var(--gold)}
.answer .k{font-weight:800;font-size:14px;color:var(--dim)}
.answer .v{font-family:var(--fd);font-size:46px;line-height:1.05;color:var(--gold);margin:4px 0;word-break:break-word}
.answer p{margin:6px 0 0;font-size:16px;line-height:1.35;color:var(--chalk2)}
.boards{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.bd{background:var(--chalk);color:var(--ink);border-radius:18px;padding:10px 12px;border-left:10px solid var(--tc);box-shadow:0 4px 0 var(--deep);animation:drop .4s var(--pop) both}
.bd .top{display:flex;align-items:baseline;gap:8px}
.bd .nm{font-family:var(--fd);font-size:17px;flex:none}
.bd .rg{flex:1;min-width:0;font-weight:900;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.bd .pt{flex:none;font-family:var(--fd);font-size:18px;min-width:44px;text-align:center;border-radius:99px;padding:2px 8px;background:#e3efe7}
.bd.good .pt{background:var(--gold)}
.bd.bad{opacity:.7}
.bd .note{font-size:13px;font-weight:800;color:#3f6b55;margin-top:2px}
.bd .line{position:relative;height:16px;margin-top:8px;border-radius:8px;background:#e3efe7}
.bd .line .seg{position:absolute;top:2px;bottom:2px;min-width:8px;border-radius:6px;background:var(--tc)}
.bd .line .ans{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.bd.mine{box-shadow:0 4px 0 var(--deep),0 0 0 3px var(--gold)}
.win{position:relative;background:var(--tc);color:var(--tx);border-radius:28px;padding:22px 16px;text-align:center;margin:6px 0 14px;box-shadow:0 9px 0 var(--td),0 0 0 4px var(--chalk);overflow:hidden;animation:drop .6s var(--pop) both}
.win .w1{font-size:18px;font-weight:800}
.win .w2{font-family:var(--fd);font-size:48px;line-height:1.05;margin:6px 0;word-break:break-word}
.final{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.final li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;padding:8px 12px 8px 8px;background:#eaf5ee;border-radius:14px}
.final .pos{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:var(--tx);font-family:var(--fd);font-size:16px}
.final .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final .p{font-family:var(--fd);font-size:20px}
#banner{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--coral);color:#fff;text-align:center;font-weight:800;font-size:15px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;transform:translateY(-100%);transition:transform .25s}
#banner.on{transform:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:31;transform:translate(-50%,180%);background:var(--chalk);color:var(--ink);font-weight:800;font-size:16px;border-radius:16px;padding:13px 18px;max-width:calc(100vw - 32px);box-shadow:0 6px 0 var(--deep);transition:transform .3s var(--pop);text-align:center}
#toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.cf{position:absolute;width:12px;height:12px;border-radius:3px;animation:cf 1.5s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{0%{transform:translate(-50%,-50%) scale(.3)}35%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--r)/2)) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)*1.15),calc(-50% + var(--y) + 240px)) rotate(var(--r));opacity:0}}
@media (max-width:370px){.word{font-size:44px}.q{font-size:21px}.answer .v{font-size:38px}.win .w2{font-size:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
