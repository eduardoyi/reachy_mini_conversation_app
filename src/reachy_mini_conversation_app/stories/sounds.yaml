# Sounds and music for story mode, made with ElevenLabs by scripts/story_build.py (seconds, and the prompt).
# A story plays a sound just before its next line; music plays for a while (a dance, a move to copy).
# Kept short and gentle: a living room with adults in it, and a 2-year-old listening.

sound:
  story_intro:
    seconds: 4
    prompt: >-
      A short magical opening jingle for a children's story: a soft harp glissando, twinkling chimes and a gentle
      warm music-box phrase, like opening a picture book.
  story_end:
    seconds: 3.5
    prompt: >-
      A short happy ending flourish for a children's story: a bright ukulele strum, a tiny glockenspiel run and soft
      claps, cheerful and warm.
  door_knock:
    seconds: 1.5
    prompt: Three clear friendly knocks on a wooden door, a cartoon knock-knock-knock, dry and close.
  tummy_rumble:
    seconds: 1.5
    prompt: A long silly cartoon tummy rumble, a hungry stomach growl, comic and gurgly, for a children's cartoon.
  big_blow:
    seconds: 2.5
    prompt: >-
      A big cartoon gust of wind from someone blowing very hard, a long whooshing blow that swirls, comic and
      exaggerated, for a children's story.
  straw_flies:
    seconds: 2.5
    prompt: >-
      A pile of dry straw blown away by the wind: rustling, swishing and fluttering hay flying off into the air,
      ending with a soft comic pop.
  sticks_fall:
    seconds: 2.5
    prompt: >-
      A little house of wooden sticks falling down: light wooden clattering and tumbling sticks, a comic cartoon
      crash, not loud, ending with one last stick dropping.
  bricks_build:
    seconds: 2.5
    prompt: >-
      Building with bricks in a cartoon: a few gentle taps of a trowel and bricks being stacked, clink, tap, clunk,
      cheerful and rhythmic.
  straw_build:
    seconds: 2
    prompt: Quick cheerful rustling of straw being piled up fast, swish swish, light and comic, for a cartoon.
  sticks_build:
    seconds: 2
    prompt: Quick wooden taps and little hammer knocks building with sticks, tok tok tok, light and playful.
  run_away:
    seconds: 2
    prompt: Tiny cartoon feet running away very fast, a quick pitter-patter scamper with a little whistle zoom.
  dizzy:
    seconds: 2
    prompt: A cartoon dizzy sound effect, a wobbly spinning slide whistle with little twinkling birds, comic.
  roof_climb:
    seconds: 2
    prompt: Clumsy cartoon footsteps creeping on a tiled roof, tiptoe clacks and a little slip, sneaky and comic.
  splash:
    seconds: 2
    prompt: >-
      A big comic cartoon splash into a pot of water, sploosh, followed by a silly surprised yelp-like boing and
      water dripping.
  wolf_runs:
    seconds: 2.5
    prompt: >-
      A cartoon character running far away very fast into the distance, quick scampering feet and a zooming
      whistle that fades out.
  oink:
    seconds: 1.5
    prompt: Two cute happy little piglet oinks and a tiny squeal of joy, friendly and soft, for a children's story.
  sparkle:
    seconds: 1.5
    prompt: A short bright magical sparkle, twinkling chimes going up, for a children's game when something good happens.

  # The second batch of stories (2026-11-07).
  rain:
    seconds: 3
    prompt: Gentle light rain pattering on garden leaves and soil, soft and calm, for a children's story.
  growing:
    seconds: 2.5
    prompt: >-
      A magical cartoon growing sound: a rising slide whistle with soft twinkling chimes and a little stretchy
      creak, something growing bigger and bigger, playful.
  pull_strain:
    seconds: 2
    prompt: >-
      A comic cartoon strain of something stuck being pulled hard: a rubbery creaky stretch that wobbles and does
      not give, for a children's story.
  pop_out:
    seconds: 2.5
    prompt: >-
      A huge comic pop like a giant cork coming out, followed by a soft bouncy tumble of everyone falling over onto
      the grass, cartoon thuds and boings.
  dog_bark:
    seconds: 1.5
    prompt: Two friendly happy cartoon dog barks, woof woof, playful and warm, not loud.
  cat_meow:
    seconds: 1.5
    prompt: A long, lazy, drawling cartoon cat meow, sleepy and a bit proud, cute.
  mouse_squeak:
    seconds: 1.5
    prompt: A few tiny cute cartoon mouse squeaks, quick and high, eee eee, soft.
  forest_birds:
    seconds: 3
    prompt: Cheerful little birds chirping in a sunny forest in the morning, gentle and calm.
  porridge_slurp:
    seconds: 2
    prompt: A happy cartoon slurp of porridge and a few spoon clinks on a wooden bowl, comic and cute.
  chair_break:
    seconds: 2
    prompt: >-
      A little wooden chair cracking and collapsing in a cartoon, a creak then a light comic crash and one piece
      falling with a boing, not loud.
  snore:
    seconds: 3
    prompt: Soft cute cartoon snoring of a child sleeping, a gentle snore and a little whistle, two times.
  bear_steps:
    seconds: 2.5
    prompt: Heavy friendly cartoon footsteps approaching on a wooden floor, thump, thump, thump, comic, not scary.
  boing:
    seconds: 1.5
    prompt: A cartoon spring boing of someone jumping up in surprise, with a little slide whistle up.
  hee_haw:
    seconds: 2
    prompt: A cartoon donkey braying hee-haw, comic and friendly, for a children's story.
  rooster_crow:
    seconds: 2
    prompt: A cartoon rooster crowing cock-a-doodle-doo, proud and silly, a little off-key.
  drum_beat:
    seconds: 1.5
    prompt: Two big friendly bass drum booms, boom, boom, like a small marching drum, warm.
  animal_concert:
    seconds: 4
    prompt: >-
      A comic animal concert all at once: a donkey braying, a dog barking, a cat yowling and a rooster crowing
      together, loud silly cacophony with a drum boom, ending with a wooden cartoon crash and a boing.
  engine_rev:
    seconds: 2.5
    prompt: >-
      A cartoon racing car engine revving twice, vroom vroom, punchy and playful, for a children's cartoon, not too
      loud.
  truck_putter:
    seconds: 2.5
    prompt: >-
      A little old cartoon truck puttering along slowly, a friendly chug-chug-chug engine with a small backfire pop,
      cute and comic.
  car_zoom:
    seconds: 2
    prompt: A cartoon race car zooming past very fast, a rising whoosh and a short tyre squeal, comic, not too loud.
  car_horn:
    seconds: 1.5
    prompt: A cute little cartoon car horn honking twice, beep beep, friendly and bright.
  crowd_cheer:
    seconds: 3
    prompt: >-
      A small happy crowd of children and toy cars cheering at a race, with little horns beeping and clapping,
      joyful, not too loud.
  car_wash:
    seconds: 3
    prompt: >-
      A cartoon car wash: water spraying, soapy foam squishing and big brushes swishing, with bubbles popping,
      playful.
  truck_climb:
    seconds: 3
    prompt: >-
      A little old cartoon truck straining up a steep hill, its engine chugging slower and slower, then a happy
      toot as it reaches the top, comic.

music:
  story_move:
    seconds: 15
    prompt: >-
      Bouncy playful music for small children doing a silly move, about 115 bpm: ukulele, pizzicato strings, light
      hand claps and a xylophone melody; cheerful, simple, no vocals.
  story_build:
    seconds: 15
    prompt: >-
      Busy cheerful working music for a children's cartoon, about 120 bpm: plucky strings, woodblocks and a
      whistled-sounding flute melody, like little pigs building a house; no vocals.
  story_dance:
    seconds: 20
    prompt: >-
      Happy party dance music for preschool children, about 125 bpm: ukulele, bouncy bass, hand claps, toy piano
      and glockenspiel; joyful celebration, simple and catchy, no vocals.
  story_march:
    seconds: 15
    prompt: >-
      A cheerful little marching band for preschool children, about 110 bpm: a bass drum, a snare, a tuba and a
      kazoo-like melody, silly and proud, simple, no vocals.
  story_tiptoe:
    seconds: 15
    prompt: >-
      Sneaky tiptoe music for a children's cartoon, about 90 bpm: soft pizzicato strings, a bassoon and light
      woodblock taps, curious and comic, never scary, no vocals.
  story_race:
    seconds: 15
    prompt: >-
      Fast fun racing music for preschool children, about 140 bpm: a driving bouncy bass, snare rolls, a bright
      brass melody and slide whistles, like a cartoon car chase, playful, never scary, no vocals.
