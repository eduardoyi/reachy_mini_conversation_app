# Lines every story shares, in the narrator's voice (docs/plans/story-mode.md).

again:
  es: "[warm] ¿Les gustó? [excited] ¿Les cuento otro cuento?"
  it: "[warm] Vi è piaciuta? [excited] Ne racconto un'altra?"

goodbye:
  es: "[warm] ¡Gracias por escuchar! [whispers] Chao, chao."
  it: "[warm] Grazie per avere ascoltato! [whispers] Ciao, ciao."

# The screen stopped checking in during a story: it naps 5 minutes after a failed check-in, and its back button
# wakes it (2026-11-09).
screen_nap:
  es: "[whispers] Uy... se me durmió la pantalla. [playful] ¿Alguien le aprieta el botoncito de atrás para despertarla?"
  it: "[whispers] Oh... lo schermo si è addormentato. [playful] Qualcuno preme il bottoncino dietro per svegliarlo?"

# After a plain yes to "¿otro cuento?", two other stories by name: offer_<first> then or_<second> (2026-11-10).
offer_tres_cerditos:
  es: "[excited] ¡Dale! ¿Les cuento Los tres cerditos..."
  it: "[excited] Va bene! Vi racconto I tre porcellini..."
or_tres_cerditos:
  es: "[curious] ...¿o Los tres cerditos?"
  it: "[curious] ...o I tre porcellini?"
