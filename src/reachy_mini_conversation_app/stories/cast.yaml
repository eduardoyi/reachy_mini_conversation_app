# La Befana (2026-11-11). Misifú (Micio) is the cat above.

befana:
  description: >-
    Reuses "Detectives · Who Ate the Cookies? · Grandma" (also the turnip story's grandma; never in the same story):
    a sweet grandmother, warm, funny and a bit cheeky. The Befana, a busy, kind old woman who flies on a broom.
  voice: "FTUoMlBeU7pi34pUd8vh"
  look: >-
    the Befana, a small, kind, bony old woman with a big hooked nose, a wide gap-toothed smile and rosy wrinkled
    cheeks, a dark knotted headscarf over wispy white hair, a big patched shawl, a long skirt covered in square
    patches, worn-out boots with holes in them and a long straw broom

king:
  description: >-
    Reuses "Samuel" (also the Bigotes musician; never in the same story): a deep, kind, grand voice. The eldest of the
    three kings who visit the Befana.
  voice: "ELKUz2Dml0Jmy3lgo9pY"
  look: >-
    a tall, kind old king with a long white beard, a tall pointed crown, a long heavy robe with a wide embroidered
    border and a fur collar, holding a small carved treasure chest

