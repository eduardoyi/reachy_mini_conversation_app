tailor:
  description: >-
    Reuses "mama_pig": a kind, warm, gentle adult voice. A kind tailor.
  voice: "Xg76FEi4dbIiAKTuqhdB"
  look: >-
    a small, plump, kind tailor lady with short grey curly hair, half-moon glasses on a chain, a tape measure around
