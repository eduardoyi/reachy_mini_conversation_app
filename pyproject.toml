[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_mini_conversation_app"
version = "1.0.1"
authors = [{ name = "Pollen Robotics", email = "contact@pollen-robotics.com" }]
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.17.0",
    "httpx>=0.28.1",

    #Environment variables
    "python-dotenv",

    #OpenAI (used by the Hugging Face backend)
    "openai==2.28.0",
    # Public GPT Live WebSocket transport; already used transitively by the SDK.
    "websockets>=15,<16",

    #Google Gemini Live (used by the Gemini backend)
    "google-genai==2.19.0",

    #Reachy mini
    "reachy_mini_dances_library",
    "reachy-mini>=1.11.0,<1.13",
    "mcp>=1.27.1,<2",

    #Tuya smart lights and plugs over the local network
    "tinytuya>=1.16,<2",
    #Android / Google TV remote control over the local network
    "androidtvremote2>=0.3.2,<0.4",
    #E-ink display screens: decoding drawings and drawing text
    "pillow>=13.0.0,<14",
]

[dependency-groups]
dev = [
  "allure-pytest==2.16.0",
  "pytest",
  "pytest-asyncio",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
  "mypy==2.2.0",
  "pre-commit",
]
sim = [
  "reachy-mini[mujoco]>=1.11.0,<1.13",
]
wake-runtime = [
  "openwakeword @ git+https://github.com/dscripka/openWakeWord.git@368c03716d1e92591906a84949bc477f3a834455",
]
wake-benchmark = [
  "pypinyin==0.55.0",
  "sherpa-onnx==1.13.6",
  "sherpa-onnx-core==1.13.6",
  "sentencepiece==0.2.2",
]

[project.scripts]
reachy-mini-conversation-app = "reachy_mini_conversation_app.main:main"
wake-benchmark = "reachy_mini_conversation_app.sherpa_wake_benchmark:main"
reachy-mic-levels = "reachy_mini_conversation_app.mic_level_probe:main"
reachy-wake-calibrate = "reachy_mini_conversation_app.wake_calibration:main"
reachy-admin = "reachy_mini_conversation_app.admin.server:main"
reachy-wake-nightly = "reachy_mini_conversation_app.wake_learning.nightly:main"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
"reachy-mini" = false
"reachy-mini-dances-library" = false

[project.entry-points."reachy_mini_apps"]
reachy_mini_conversation_app = "reachy_mini_conversation_app.main:ReachyMiniConversationApp"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reachy_mini_conversation_app = [
  "static/**/*",
  ".env.example",
]
reachy_talk_data = [
  "profiles/**/*.md",
]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
]
ignore = [
  "E501",  # handled by formatter
  "D100",  # ignore missing module docstrings
  "D203",  # blank line before class docstring (conflicts with D211)
  "D213",  # summary on second line (conflicts with D212)
]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = ["standard-library", "local-folder"]
known-local-folder = ["reachy_mini_conversation_app"]
known-first-party = ["reachy_mini", "reachy_mini_dances_library"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src/"]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true
